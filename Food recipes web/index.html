  <template id="detail-panel-template">
    <article class="detail-panel" data-id="">
      <div class="perforation" aria-hidden="true"></div>
      <div class="detail-head">
        <span class="ticket-num"></span>
        <span class="ticket-type" data-field="mealType"></span>
      </div>
      <div class="detail-image">
        <img data-field="image" alt="">
        <span class="stamp" data-field="difficulty"></span>
      </div>
      <h1 class="detail-name" data-field="name"></h1>
      <p class="detail-cuisine" data-field="cuisine"></p>
      <ul class="ticket-lines ticket-lines--detail">
        <li><span>PREP TIME</span><i></i><b data-field="prepTimeMinutes"></b></li>
        <li><span>COOK TIME</span><i></i><b data-field="cookTimeMinutes"></b></li>
        <li><span>SERVINGS</span><i></i><b data-field="servings"></b></li>
        <li><span>CAL / SERVING</span><i></i><b data-field="caloriesPerServing"></b></li>
      </ul>
      <div class="detail-footer">
        <div class="rating" data-field="rating"></div>
        <div class="tag-row" data-field="tags"></div>
      </div>
      <div class="detail-columns">
        <div class="ingredients-block">
          <h2 class="block-title">INGREDIENTS</h2>
          <ul class="ingredients-list" data-field="ingredients"></ul>
        </div>
        <div class="instructions-block">
          <h2 class="block-title">INSTRUCTIONS</h2>
          <ol class="instructions-list" data-field="instructions"></ol>
        </div>
      </div>
    </article>
